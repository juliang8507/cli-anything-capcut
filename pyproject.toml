[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-capcut"
# 버전은 cli_anything/capcut/__init__.py 가 단일 소스다.
dynamic = ["version"]
description = "CLI harness for pyCapCut — scriptable CapCut / JianYing draft generation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "juliang8507" }]
keywords = ["capcut", "jianying", "video", "cli", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    # Windows 전용이다. 폰트 해석이 CapCut 캐시 / CapCut SystemFont /
    # 사용자 Fonts / Windows Fonts 네 경로를 스캔하고, 드래프트 폴더 감지와
    # GUI 렌더도 Windows 경로를 전제한다.
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "click>=8.0.0,<9.0.0",
    "prompt-toolkit>=3.0.0,<4.0.0",
    # NOTE: PyPI 0.0.3 에는 TextSegment(shadow=...) 가 없다. 내장 텍스트 스타일을
    # 쓰려면 README 의 upstream git 설치 안내를 따를 것.
    # 0.0.x 는 아직 불안정 버전대다. 실제로 0.0.3 과 upstream git 사이에
    # TextSegment(shadow=...) 유무 차이가 있었다. 상한을 0.1.0 으로 둔다.
    "pycapcut>=0.0.3,<0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
windows-render = ["uiautomation>=2.0"]
plan = ["anthropic>=0.40.0"]

[project.scripts]
cli-anything-capcut = "cli_anything.capcut.capcut_cli:main"

[project.urls]
Homepage = "https://github.com/juliang8507/cli-anything-capcut"
Issues = "https://github.com/juliang8507/cli-anything-capcut/issues"

[tool.setuptools.dynamic]
version = { attr = "cli_anything.capcut.__version__" }

[tool.setuptools.packages.find]
include = ["cli_anything*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["cli_anything/capcut/tests"]
