name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 이 도구는 Windows + CapCut 설치 환경을 전제로 한다.
# 폰트 해석은 CapCut 캐시 / CapCut SystemFont / 사용자 Fonts / Windows Fonts
# 네 위치를 스캔하고, 드래프트 폴더 감지와 GUI 렌더도 Windows 경로를 쓴다.
# 그래서 CI 도 windows 러너에서 돈다 — ubuntu 에서는 내장 텍스트 스타일이
# 참조하는 시스템 폰트가 존재하지 않아 검증 자체가 성립하지 않는다.
jobs:
  # 이 저장소는 개인 개발본에서 주기적으로 동기화된다. 동기화할 때마다 사람이
  # 기억해서 익명화하는 방식은 언젠가 실패하므로 게이트로 막는다.
  # 파일 텍스트만 읽으므로 ubuntu 에서 빠르게 돈다.
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan for private strings
        run: python scripts/scan_private.py

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PyPI 의 pycapcut 0.0.3 에는 TextSegment(shadow=...) 가 없다.
      # upstream git 에는 있으나(2025-08-15, b846b95) 그 뒤로 배포가 없었고,
      # upstream setup.py 는 git 에 없는 pypi_readme.md 를 읽어서
      # `pip install git+...` 가 그대로는 실패한다. clone 후 보완해 설치한다.
      - name: Install pycapcut (upstream git, pinned)
        run: |
          git clone https://github.com/GuanYixuan/pyCapCut.git pycapcut-src
          cd pycapcut-src
          git checkout 00c223aa246f955d741b17b703e10270b22ec75e
          Copy-Item README.md pypi_readme.md
          pip install .

      # 내장 텍스트 스타일이 참조하는 한글 폰트를 사용자 폰트 폴더에 둔다.
      # windows 러너에 맑은 고딕은 있으나 Noto 계열은 없다. 폰트 탐색은
      # 한글 cmap 이 있는 파일만 등록하므로 KR 서브셋을 받는다.
      - name: Install Noto KR fonts (user font dir)
        run: |
          $dir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $base = "https://raw.githubusercontent.com/google/fonts/main/ofl"
          curl.exe -sSL -o "$dir\NotoSansKR.ttf"  "$base/notosanskr/NotoSansKR%5Bwght%5D.ttf"
          curl.exe -sSL -o "$dir\NotoSerifKR.ttf" "$base/notoserifkr/NotoSerifKR%5Bwght%5D.ttf"
          Get-ChildItem $dir | Select-Object Name, Length

      # render-headless / import-draft 의 영상 픽스처가 ffmpeg 를 쓴다.
      # 없으면 해당 테스트가 조용히 skip 되어 렌더 경로가 검증되지 않는다.
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plan]"

      # -rs: skip 된 테스트와 그 사유를 로그에 남긴다.
      # 어떤 검증이 이 환경에서 빠졌는지 보이지 않으면 통과가 과대평가된다.
      - name: Run tests
        run: pytest cli_anything/capcut/tests/ -rs
