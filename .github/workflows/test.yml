name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 이 도구는 Windows + CapCut 설치 환경을 전제로 한다.
# 폰트 해석은 CapCut 캐시 / CapCut SystemFont / 사용자 Fonts / Windows Fonts
# 네 위치를 스캔하고, 드래프트 폴더 감지와 GUI 렌더도 Windows 경로를 쓴다.
# 그래서 CI 도 windows 러너에서 돈다 — ubuntu 에서는 내장 텍스트 스타일이
# 참조하는 시스템 폰트가 존재하지 않아 검증 자체가 성립하지 않는다.
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PyPI 의 pycapcut 0.0.3 에는 TextSegment(shadow=...) 가 없다.
      # upstream git 에는 있으나(2025-08-15, b846b95) 그 뒤로 배포가 없었고,
      # upstream setup.py 는 git 에 없는 pypi_readme.md 를 읽어서
      # `pip install git+...` 가 그대로는 실패한다. clone 후 보완해 설치한다.
      - name: Install pycapcut (upstream git, pinned)
        run: |
          git clone https://github.com/GuanYixuan/pyCapCut.git pycapcut-src
          cd pycapcut-src
          git checkout 00c223aa246f955d741b17b703e10270b22ec75e
          Copy-Item README.md pypi_readme.md
          pip install .

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plan]"

      - name: Run tests
        run: pytest cli_anything/capcut/tests/
