name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # PyPI pycapcut 0.0.3 에는 TextSegment(shadow=...) 가 없다.
          # upstream git 을 커밋 고정으로 설치한다.
          pip install "pycapcut @ git+https://github.com/GuanYixuan/pyCapCut.git@00c223aa246f955d741b17b703e10270b22ec75e"
          pip install -e ".[dev,plan]"

      - name: Run tests
        run: pytest cli_anything/capcut/tests/
